# DEPRECATED — DO NOT USE. This file no longer configures anything.
#
# It used to hold the LiteLLM routing for the original 4x RTX PRO 6000
# single-box setup (nemotron-nano :8001, nemotron-super :8003/:8004,
# gte-Qwen2 :8011, all on localhost). None of those models or ports exist in
# this deployment, and aivm has no GPUs at all.
#
# It has been emptied deliberately. Left populated, it was a trap: anything
# that started LiteLLM against it would come up on :4000 advertising models
# that cannot answer, which breaks every LLM-dependent tool in the fleet in a
# way that looks like a tool bug rather than a proxy misconfiguration. Failing
# loudly on an empty config is the safer outcome.
#
# ── Where the real configuration lives ───────────────────────────────────────
#
#   litellm/cluster_config.yaml   The live proxy config. GENERATED — written
#                                 only by the control agent (agent/agent.py,
#                                 _proxy_write_and_restart) from the vLLM
#                                 instances actually running across the
#                                 cluster. Never hand-edit it; it is rewritten
#                                 on every launch/stop and reconciled every
#                                 60s.
#
#   node_config.json              This node's role, agent port, proxy host/port
#                                 and the child node inventory.
#
# ── How to bring the proxy up ────────────────────────────────────────────────
#
#   bash boot.sh                  Control agent, then POST /proxy/sync to
#                                 regenerate the config and (re)start the
#                                 proxy. This is what the fleet boot
#                                 orchestrator and watchdog run (see
#                                 boot.meta.json, key "llm-proxy").
#
#   ./node.sh start               Equivalent role-aware start.
#   ./node.sh install-systemd     Adds OS-level crash-restart units (needs sudo).
#
# To change routing, change which model instances are running (the agent's
# /instances/launch, or the cluster dashboard) and the config follows. There is
# no hand-maintained model list anywhere.
